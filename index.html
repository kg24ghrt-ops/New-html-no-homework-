<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>B5 Notebook Paper</title>
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<canvas id="canvas"></canvas>
<div id="msg"></div>
<button id="resetBtn" aria-label="Reset view" title="Reset view (R)">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
<path d="M21 12a9 9 0 1 1-9 9 9.75 9.75 0 0 1 6.74-2.74L21 16"></path>
</svg>
</button>
<script type="module" src="js/index.js"></script>
<script>
window.setTimeout(function () {
	if (window.__b5ready === true || document.getElementById("b5Error")) return;
	var banner = document.createElement("div");
	banner.id = "b5Error";
	banner.setAttribute("role", "alert");
	var label = document.createElement("span");
	label.className = "b5-error-text";
	label.textContent = "The notebook failed to load. A script file may be missing: check js/*.js.";
	var close = document.createElement("button");
	close.type = "button";
	close.setAttribute("aria-label", "Dismiss error");
	close.textContent = "\u00d7";
	close.onclick = function () { banner.remove(); };
	banner.appendChild(label);
	banner.appendChild(close);
	document.body.appendChild(banner);
}, 4000);
</script>
</body>
</html>
